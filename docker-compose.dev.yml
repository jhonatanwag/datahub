version: '3.8'

services:

  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: datahub_postgres
    restart: unless-stopped
    mem_limit: 1g            # teto de RAM do container (sem isso ele enxerga a máquina toda)
    memswap_limit: 1g        # = mem_limit: proíbe swap, senão o Windows/WSL trava paginando em disco
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: datahub_redis
    restart: unless-stopped
    # Cache de queries + tokens de PDF: tudo tem TTL, então volatile-lru descarta os mais antigos
    # quando enche em vez de crescer sem limite (o padrão era maxmemory 0 = ilimitado).
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    mem_limit: 384m
    memswap_limit: 384m
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Backend FastAPI ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: datahub_backend
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 2.0
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env.dev
    volumes:
      - ./backend:/app        # hot reload
      - backend_data:/data    # logos de empresa (/data/logos/*.png) — senão somem a cada rebuild do container
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Worker ARQ ───────────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: datahub_worker
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    command: python -m arq worker.WorkerSettings
    env_file:
      - ./backend/.env.dev
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Frontend SvelteKit ───────────────────────────────────────
  frontend:
    image: node:20-alpine
    container_name: datahub_frontend
    restart: unless-stopped
    mem_limit: 1g            # `npm install` + Vite dev
    memswap_limit: 1g
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  # ── PDF renderer (headless Chrome) ───────────────────────────
  pdf-renderer:
    build:
      context: ./renderer
    container_name: datahub_pdf_renderer
    restart: unless-stopped
    # É o serviço que já derrubou a máquina: um Chrome imprimindo um relatório enorme passou de 3 GB.
    # Se estourar o teto, o kernel mata só o Chrome (o node sobrevive e responde erro), não a máquina.
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2.0
    pids_limit: 512
    environment:
      - RENDERER_SECRET=dev-secret
      - RELATORIO_BASE_URL=http://frontend:3000
      # Guardas do renderer (defaults no server.mjs; descomente pra ajustar sem rebuild):
      # - RENDER_TIMEOUT_MS=50000      # tempo máximo por PDF
      # - RENDER_MAX_ALTURA_PX=80000   # recusa relatório mais alto que isso (~100 páginas paisagem)
      # - RENDER_MAX_NOS_DOM=250000    # recusa relatório com mais elementos que isso
      # - RENDER_MAX_FILA=4            # pedidos esperando vaga; acima disso responde 503
    depends_on:
      - frontend
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  backend_data:
